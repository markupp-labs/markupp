name: markupp
description: Stack dev do markupp, usada pelo smoke do CI e pelo ambiente local
runtime: yaml

packages:
  markupp: ../pulumi

config:
  namespace:
    type: string
    default: markupp
  image:
    type: string
  host:
    type: string
  certificateIssuer:
    type: string
    default: acme
  acmeEmail:
    type: string
    default: ""
  storageClass:
    type: string
  apiReplicas:
    type: integer
    default: 2
  email:
    type: object
    default: {}
  existingGateway:
    type: object
    default: {}
  panel:
    type: object
    default: {}
  mcp:
    type: object
    default: {}

resources:
  markupp:
    type: markupp:index:Markupp
    properties:
      namespace: ${namespace}
      image: ${image}
      host: ${host}
      certificateIssuer: ${certificateIssuer}
      acmeEmail: ${acmeEmail}
      apiReplicas: ${apiReplicas}
      email: ${email}
      existingGateway: ${existingGateway}
      panel: ${panel}
      mcp: ${mcp}
      database:
        storageClass: ${storageClass}

outputs:
  url: ${markupp.url}
