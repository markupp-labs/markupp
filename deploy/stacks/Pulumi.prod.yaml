# Enterprise no cluster do IFSC, atrás do Gateway da feira de jogos, que tem o
# listener e o certificado do host. A imagem muda a cada tag pelo deploy do
# workflow de release, e o email entra com pulumi config set --path quando
# houver SMTP.
config:
  markupp:host: markupp.k8s.sj.ifsc.edu.br
  markupp:image: ghcr.io/markupp-labs/markupp:1.0.0-rc.2
  markupp:storageClass: longhorn-fast
  markupp:existingGateway:
    name: gateway-feira-de-jogos
    namespace: feira-de-jogos
    sectionName: https-markupp
