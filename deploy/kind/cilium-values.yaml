# Espelha o cilium.yaml do cluster do IFSC: Gateway API com o Envoy na rede
# do nó, sem kube-proxy. O k8sServiceHost é preenchido pelo script, e o
# operator tem uma réplica porque o kind tem um nó só.
kubeProxyReplacement: true
k8sServicePort: 6443
ipam:
  mode: kubernetes
gatewayAPI:
  enabled: true
  enableAlpn: true
  hostNetwork:
    enabled: true
envoy:
  enabled: true
  securityContext:
    privileged: true
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_BIND_SERVICE
operator:
  replicas: 1
