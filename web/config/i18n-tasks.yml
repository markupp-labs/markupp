# Chaves faltando ou sem uso nas traduções do painel, conferidas pelo test/i18n_test.rb.
base_locale: en
locales: [en, pt-BR]

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/*.%{locale}.yml
  yaml:
    write:
      line_width: -1

# O lookup preguiçoso num método privado do controller usa a action (destroy), não o nome do método que o i18n-tasks vê.
ignore_missing:
  - settings.members.leave_tenant.left
  - tenants.refuse_unconfirmed_deletion.name_mismatch

ignore_unused:
  # Procuradas pelo próprio Rails: erros e atributos do ActiveModel, rótulos do form.label e o time_ago_in_words com
  # scope: :datetime_short.
  - activemodel.*
  - helpers.label.*
  - datetime_short.*
  # Chave montada pelo leave_panel_session do PasswordResetsController.
  - password_resets.create.changed*
  # As duas do ignore_missing, na action em que o Rails procura.
  - settings.members.destroy.left
  - tenants.destroy.name_mismatch
