      notas_leitura: "Read your notes"
      notas_escrita: "Create, edit and delete your notes"
      administracao: "Manage your tenants, members and invites"
    show:
      title: "%{client} wants to access your markupp"
      signed_in_as: "Signed in as %{email}"
