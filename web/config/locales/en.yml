      accept_invite: "Accept it here."
      forgot_password: "Forgot password?"
    destroy:
      logged_out: "Logged out."
  invite_acceptances:
    new:
      title: "Accept an invite"
      hint: "Paste the token from the invite email and choose a password for your new account."
      password: "Password"
      submit: "Create account"
      log_in: "Log in"
  password_requests:
    new:
      title: "Reset your password"
      submit: "Send"
      token_hint: "Got the token already?"
      have_token: "I have a token"
    create:
      sent: "If an account uses that email, a reset token is on its way."
      invalid_email: "Enter the email of your account."
      email_unavailable: "This server can't send email. Ask an administrator to reset your password."
      local_auth_disabled: "Password login is disabled on this server."
  password_resets:
    new:
      title: "Choose a new password"
      hint: "Paste the token from the email and choose a new password."
      password: "New password"
      submit: "Reset password"
    create:
      changed: "Password changed. Log in with the new one."
      changed_signed_out: "Password changed. Log in again."
  password_changes:
    create:
      sent: "Password reset email sent to %{email}. Use its token to choose the new password."
  email_verifications:
    create:
      sent: "Confirmation email sent. It may take a few minutes."
      email_unavailable: "This server can't send email. Ask an administrator to confirm your email."
  email_confirmations:
    new:
      title: "Confirm your email"
      hint: "Paste the token from the confirmation email."
      submit: "Confirm"
    create:
      confirmed: "Email confirmed. Pending invites now show up in your tenant list."
  # Unidades da idade curta (CompactAgeHelper): o maior passo que cabe, sem espaço entre o número e a unidade.
  compact_age:
    now: "now"
    y: "%{count}y"
    mo: "%{count}mo"
    w: "%{count}w"
    d: "%{count}d"
    h: "%{count}h"
    m: "%{count}m"
  errors:
    show:
      back_to_notes: "Back to your notes"
      back_to_login: "Go to log in"
      "400":
        title: "Bad request"
        hint: "The panel could not read what was sent. Go back and try again."
      "404":
        title: "Nothing at %{path}"
        hint: "Check the address, or go back from here."
      "406":
        title: "Can't answer in that format"
        hint: "This address only answers web pages. Open it in the browser."
      "422":
        title: "Change rejected"
        hint: "The form may have expired. Reload the page and send it again."
      "500":
        title: "Something broke on the panel"
        hint: "The error was logged. Try again in a moment."
      other:
        title: "Request failed"
        hint: "Go back and try again."
