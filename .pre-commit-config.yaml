default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: mensagem-de-commit
        name: valida a mensagem de commit
        entry: scripts/valida-mensagem-de-commit.sh
        language: script
        stages: [commit-msg]

      - id: goimports
        name: goimports nos arquivos go alterados
        entry: bash -c 'desformatados="$(go run golang.org/x/tools/cmd/goimports@v0.50.0 -l "$@")"; [ -z "$desformatados" ] || { printf "fora do goimports:\n%s\n" "$desformatados"; exit 1; }' --
        language: system
        types: [go]
