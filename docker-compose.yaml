x-servidor: &servidor
  build:
    context: ./markupp
    dockerfile: Dockerfile.dev
  environment: &ambiente
    MARKUPP_DATABASE_URL: postgres://markupp:${POSTGRES_PASSWORD:-markupp}@postgres:5432/markupp?sslmode=disable
    MARKUPP_AUTH_REGISTRATION_ENABLED: ${MARKUPP_AUTH_REGISTRATION_ENABLED:-false}
  volumes:
    - ./markupp:/src
    - ${GO_MOD_CACHE:-go_mod_cache}:/go/pkg/mod

services:
  postgres:
    image: postgres:17.9-alpine3.23
    environment:
      POSTGRES_USER: markupp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markupp}
      POSTGRES_DB: markupp
    volumes:
      - ${POSTGRES_VOLUME:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markupp -d markupp"]
      interval: 2s
      retries: 15

  migrate:
    <<: *servidor
    command: ["go", "run", "-C", "/src", "./cmd/markupp", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # O self-host não tem KEDA: o mesmo indexador roda em laço (ADR-0032). Erro do banco
  # vai para o log e o laço tenta de novo no próximo intervalo.
  indexer:
    <<: *servidor
    command: ["go", "run", "-C", "/src", "./cmd/markupp", "index-loop"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # O self-host não tem KEDA: o notificador fica em laço, como o indexador.
  notifier:
    <<: *servidor
    environment:
      <<: *ambiente
      # O Mailpit recebe todo email de desenvolvimento; a caixa fica em http://localhost:8025
      MARKUPP_SMTP_URL: smtp://mailpit:1025?tls=none
      MARKUPP_SMTP_FROM: convites@markupp.local
    command: ["go", "run", "-C", "/src", "./cmd/markupp", "notify-loop"]
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  markupp:
    <<: *servidor
    environment:
      <<: *ambiente
      MARKUPP_INVITE_BY_EMAIL: "true"
      # Segredos gerados no banco na primeira subida (ADR-0041). A URL pública acompanha
      # a porta publicada no host; o servidor MCP fica nela em /mcp, encaminhado pelo Go.
      MARKUPP_PUBLIC_URL: ${MARKUPP_PUBLIC_URL:-http://localhost:${MARKUPP_PORT:-8080}}
      # O login e o consentimento do OAuth acontecem no painel do serviço web.
      MARKUPP_PANEL_URL: ${MARKUPP_PANEL_URL:-http://localhost:${WEB_PORT:-3000}}
      MARKUPP_MCP_UPSTREAM_URL: http://mcp:3000
      MARKUPP_MCP_SECRET_PATH: /run/markupp-mcp/secret
    volumes:
      - ./markupp:/src
      - ${GO_MOD_CACHE:-go_mod_cache}:/go/pkg/mod
      - mcp_secret:/run/markupp-mcp
    ports:
      - "${MARKUPP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      BINDING: 0.0.0.0
      MARKUPP_API_URL: http://markupp:8080
      # A página Agents mostra aos clientes MCP o /mcp desta URL, a mesma do servidor.
      MARKUPP_PUBLIC_URL: ${MARKUPP_PUBLIC_URL:-http://localhost:${MARKUPP_PORT:-8080}}
    volumes:
      - ./web:/rails
      - ${BUNDLE_CACHE:-bundle_cache}:/usr/local/bundle
    depends_on:
      - markupp

  # Servidor MCP (ADR-0045): descobre o issuer pelo Go e lê o segredo que o Go escreve no
  # volume compartilhado. Os agentes chegam a ele pelo /mcp do Go.
  mcp:
    build:
      context: ./mcp
    environment:
      MARKUPP_MCP_API_URL: http://markupp:8080
      MARKUPP_MCP_SECRET_PATH: /run/markupp-mcp/secret
    volumes:
      - mcp_secret:/run/markupp-mcp:ro
    depends_on:
      markupp:
        condition: service_started

volumes:
  postgres_data:
  go_mod_cache:
  bundle_cache:
  mcp_secret:
