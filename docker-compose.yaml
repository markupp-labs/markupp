services:
  markupp:
    build:
      context: ./markupp
      dockerfile: Dockerfile.dev
    ports:
      - "${MARKUPP_PORT:-8080}:8080"
    volumes:
      - ./markupp:/src
      - ${DATA_VOLUME:-markupp_data}:/data
      - ${GO_MOD_CACHE:-go_mod_cache}:/go/pkg/mod

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      BINDING: 0.0.0.0
      MARKUPP_API_URL: http://markupp:8080
    volumes:
      - ./web:/rails
      - ${BUNDLE_CACHE:-bundle_cache}:/usr/local/bundle
    depends_on:
      - markupp

volumes:
  markupp_data:
  go_mod_cache:
  bundle_cache:
