x-servidor: &servidor
  build:
    context: ./markupp
    dockerfile: Dockerfile.dev
  environment:
    MARKUPP_DATABASE_URL: postgres://markupp:${POSTGRES_PASSWORD:-markupp}@postgres:5432/markupp?sslmode=disable
  volumes:
    - ./markupp:/src
    - ${GO_MOD_CACHE:-go_mod_cache}:/go/pkg/mod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: markupp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markupp}
      POSTGRES_DB: markupp
    volumes:
      - ${POSTGRES_VOLUME:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markupp -d markupp"]
      interval: 2s
      retries: 15

  migrate:
    <<: *servidor
    command: ["go", "run", "-C", "/src", "./cmd/markupp", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  markupp:
    <<: *servidor
    ports:
      - "${MARKUPP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  go_mod_cache:
