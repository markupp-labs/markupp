name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-image:
    name: Publica a imagem ${{ matrix.image }} no GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: markupp
            context: ./markupp
          - image: markupp-web
            context: ./web
          - image: markupp-mcp
            context: ./mcp
    permissions:
      contents: read
      packages: write
    steps:
      - name: Valida o semver da tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            printf 'release disparado em %s %s, esperado uma tag vMAJOR.MINOR.PATCH\n' "$GITHUB_REF_TYPE" "$TAG" >&2
            exit 1
          fi
          if printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            printf 'tag %s segue semantic versioning\n' "$TAG"
            exit 0
          fi
          printf 'tag %s fora do semantic versioning, esperado vMAJOR.MINOR.PATCH com prerelease opcional, por exemplo v1.0.0 ou v1.0.0-rc.1\n' "$TAG" >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrai metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  dispatch-cloud:
    name: Avisa a operação da instância oficial
    needs: publish-image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: {}
    # Sem o secret (forks e self-host), o passo é pulado e o release termina verde.
    env:
      CLOUD_DISPATCH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
    steps:
      - name: Dispara o deploy da tag no markupp-cloud
        if: env.CLOUD_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST repos/markupp-labs/markupp-cloud/dispatches \
            -f event_type=markupp-release \
            -f "client_payload[tag]=$TAG"
