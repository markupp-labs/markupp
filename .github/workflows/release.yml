name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-image:
    name: Publica a imagem ${{ matrix.image }} no GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: markupp
            context: ./markupp
          - image: markupp-web
            context: ./web
          - image: markupp-mcp
            context: ./mcp
    permissions:
      contents: read
      packages: write
    steps:
      - name: Valida o semver da tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            printf 'release disparado em %s %s, esperado uma tag vMAJOR.MINOR.PATCH\n' "$GITHUB_REF_TYPE" "$TAG" >&2
            exit 1
          fi
          if printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            printf 'tag %s segue semantic versioning\n' "$TAG"
            exit 0
          fi
          printf 'tag %s fora do semantic versioning, esperado vMAJOR.MINOR.PATCH com prerelease opcional, por exemplo v1.0.0 ou v1.0.0-rc.1\n' "$TAG" >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrai metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-prod:
    name: Deploy na stack prod
    needs: publish-image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: deploy/pulumi/go.mod
          cache-dependency-path: deploy/pulumi/go.sum

      - name: Instala o Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7

      # O token só existe neste passo, e o kubeconfig montado com ele é apagado no fim.
      - name: Pulumi up com a imagem da tag
        working-directory: deploy/stacks
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_SERVER: ${{ vars.KUBE_SERVER }}
          KUBE_CA_DATA: ${{ vars.KUBE_CA_DATA }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/markupp
          TAG: ${{ github.ref_name }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          umask 077
          cat > "$KUBECONFIG" <<KUBECONFIG
          apiVersion: v1
          kind: Config
          clusters:
            - name: prod
              cluster:
                server: $KUBE_SERVER
                certificate-authority-data: $KUBE_CA_DATA
          users:
            - name: markupp-deployer
              user:
                token: $KUBE_TOKEN
          contexts:
            - name: prod
              context:
                cluster: prod
                namespace: markupp
                user: markupp-deployer
          current-context: prod
          KUBECONFIG
          pulumi stack select hana-org/prod --non-interactive
          pulumi config set image "$IMAGE:${TAG#v}"
          pulumi config set --path panel.image "$IMAGE-web:${TAG#v}"
          pulumi config set --path mcp.image "$IMAGE-mcp:${TAG#v}"
          pulumi up --yes --non-interactive
