name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tells which packages the PR (or the push to main) changed, so each job runs only when its
  # own package changes. A skipped job counts as success for a required check, so the filter
  # lives here and not in the workflow trigger. Without a base to compare (new branch), run all.
  changes:
    name: Changed packages
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      mcp: ${{ steps.diff.outputs.mcp }}
      pulumi: ${{ steps.diff.outputs.pulumi }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=".github/workflows/ci.yml"
          else
            files="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          fi
          changed() { grep -qE "^(\.github/workflows/ci\.yml|$1)" <<< "$files" && echo true || echo false; }
          {
            echo "server=$(changed 'markupp/|Makefile|scripts/')"
            echo "mcp=$(changed 'mcp/')"
            echo "pulumi=$(changed 'deploy/pulumi/|markupp/\.golangci\.yml')"
            echo "web=$(changed 'web/')"
          } | tee -a "$GITHUB_OUTPUT"

  server-tests:
    name: Server (Go) tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markupp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: markupp/go.mod
          cache-dependency-path: markupp/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run

      - name: Run tests
        run: go test ./... -race -count=1 -coverprofile=cover.out -covermode=atomic

      - name: Server minimum coverage
        working-directory: ${{ github.workspace }}
        run: make coverage-check

      - name: Known vulnerabilities
        working-directory: ${{ github.workspace }}
        run: ./scripts/govulncheck-modulos.sh

  mcp-tests:
    name: MCP server (TypeScript) tests
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (prettier)
        run: npx prettier --check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

  pulumi-component-tests:
    name: Pulumi component (Go) tests
    needs: changes
    if: needs.changes.outputs.pulumi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: deploy/pulumi/go.mod
          cache-dependency-path: deploy/pulumi/go.sum

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run -c ../../markupp/.golangci.yml

      - name: Run tests
        run: go test ./... -race -count=1

  web-tests:
    name: Panel (Rails) tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: web/.ruby-version
          bundler-cache: true
          working-directory: web

      - name: Run rubocop
        run: bin/rubocop -f github

      - name: Run brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Known vulnerabilities
        run: |
          bin/bundler-audit
          bin/importmap audit

      - name: Run tests
        run: bin/rails test

  commit-conventions:
    name: Commit conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test support scripts
        run: make test-scripts

      - name: Validate PR commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list "$BASE..$HEAD_SHA"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message.txt"
            if ! ./scripts/valida-mensagem-de-commit.sh "$RUNNER_TEMP/message.txt"; then
              git log -1 --format='  in commit %h %s' "$commit" >&2
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            printf '%s commit(s) with a message outside the convention\n' "$failed" >&2
            exit 1
          fi
