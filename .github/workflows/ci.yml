name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Diz quais pacotes o PR (ou o push na main) mexeu, para cada job rodar só quando o dele
  # muda. Job pulado conta como sucesso no check obrigatório, por isso o filtro fica aqui e
  # não no gatilho do workflow. Sem base para comparar (branch nova), roda tudo.
  changes:
    name: Pacotes alterados
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      mcp: ${{ steps.diff.outputs.mcp }}
      pulumi: ${{ steps.diff.outputs.pulumi }}
      painel: ${{ steps.diff.outputs.painel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            alterados=".github/workflows/ci.yml"
          else
            alterados="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          fi
          mexeu() { grep -qE "^(\.github/workflows/ci\.yml|$1)" <<< "$alterados" && echo true || echo false; }
          {
            echo "server=$(mexeu 'markupp/|Makefile|scripts/')"
            echo "mcp=$(mexeu 'mcp/')"
            echo "pulumi=$(mexeu 'deploy/pulumi/|markupp/\.golangci\.yml')"
            echo "painel=$(mexeu 'web/')"
          } | tee -a "$GITHUB_OUTPUT"

  server-tests:
    name: Servidor (Go) tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markupp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: markupp/go.mod
          cache-dependency-path: markupp/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run

      - name: Run tests
        run: go test ./... -race -count=1 -coverprofile=cover.out -covermode=atomic

      - name: Coverage minimo do servidor
        working-directory: ${{ github.workspace }}
        run: make coverage-check

      - name: Vulnerabilidades conhecidas
        working-directory: ${{ github.workspace }}
        run: ./scripts/govulncheck-modulos.sh

  mcp-tests:
    name: Servidor MCP (TypeScript) tests
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (prettier)
        run: npx prettier --check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

  pulumi-component-tests:
    name: Componente Pulumi (Go) tests
    needs: changes
    if: needs.changes.outputs.pulumi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: deploy/pulumi/go.mod
          cache-dependency-path: deploy/pulumi/go.sum

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run -c ../../markupp/.golangci.yml

      - name: Run tests
        run: go test ./... -race -count=1

  painel-tests:
    name: Painel (Rails) tests
    needs: changes
    if: needs.changes.outputs.painel == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: web/.ruby-version
          bundler-cache: true
          working-directory: web

      - name: Run rubocop
        run: bin/rubocop -f github

      - name: Run brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Vulnerabilidades conhecidas
        run: |
          bin/bundler-audit
          bin/importmap audit

      - name: Run tests
        run: bin/rails test

  convencoes:
    name: Convencoes de commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testa os scripts de apoio
        run: make test-scripts

      - name: Valida as mensagens dos commits do PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TOPO: ${{ github.event.pull_request.head.sha }}
        run: |
          reprovados=0
          for commit in $(git rev-list "$BASE..$TOPO"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/mensagem.txt"
            if ! ./scripts/valida-mensagem-de-commit.sh "$RUNNER_TEMP/mensagem.txt"; then
              git log -1 --format='  no commit %h %s' "$commit" >&2
              reprovados=$((reprovados + 1))
            fi
          done
          if [ "$reprovados" -ne 0 ]; then
            printf '%s commit(s) com mensagem fora da convencao\n' "$reprovados" >&2
            exit 1
          fi
