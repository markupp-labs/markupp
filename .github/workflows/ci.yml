name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    name: Servidor (Go) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markupp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: markupp/go.mod
          cache-dependency-path: markupp/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run

      - name: Run tests
        run: go test ./... -race -count=1 -coverprofile=cover.out -covermode=atomic

      - name: Coverage minimo do servidor
        working-directory: ${{ github.workspace }}
        run: make coverage-check

  plugin-build:
    name: Obsidian plugin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present
