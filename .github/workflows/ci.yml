name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    name: Servidor (Go) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markupp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: markupp/go.mod
          cache-dependency-path: markupp/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run

      - name: Run tests
        run: go test ./... -race -count=1 -coverprofile=cover.out -covermode=atomic

      - name: Coverage minimo do servidor
        working-directory: ${{ github.workspace }}
        run: make coverage-check

      - name: Vulnerabilidades conhecidas
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  convencoes:
    name: Convencoes de commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testa os scripts de apoio
        run: make test-scripts

      - name: Valida as mensagens dos commits do PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TOPO: ${{ github.event.pull_request.head.sha }}
        run: |
          reprovados=0
          for commit in $(git rev-list "$BASE..$TOPO"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/mensagem.txt"
            if ! ./scripts/valida-mensagem-de-commit.sh "$RUNNER_TEMP/mensagem.txt"; then
              git log -1 --format='  no commit %h %s' "$commit" >&2
              reprovados=$((reprovados + 1))
            fi
          done
          if [ "$reprovados" -ne 0 ]; then
            printf '%s commit(s) com mensagem fora da convencao\n' "$reprovados" >&2
            exit 1
          fi
