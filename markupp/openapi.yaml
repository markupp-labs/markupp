          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResultResponse'
        '400':
          description: Query ausente, ou offset e limit não inteiros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /notes/{id}:
    get:
      summary: Lê uma nota
      description: |
        A nota com o conteúdo e a organização derivada que o indexador grava no
        segundo estágio do cofre: grau, PageRank e comunidade. O viewer também lê.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NoteID'
      responses:
