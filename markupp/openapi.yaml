        '403':
          $ref: '#/components/responses/ReadOnly'
        '400':
          description: Requisição inválida ou dados de nota inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Nota inexistente ou fora dos cofres do usuário (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A nota mudou desde lastModifiedAt e force não foi pedido (conflict), ou caminho duplicado no cofre (duplicate_path)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Exclui uma nota
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NoteID'
      responses:
        '204':
          description: Nota excluída
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Nota inexistente ou fora dos cofres do usuário (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /notes/{id}/links:
    get:
      summary: Lista as ligações que esta nota faz
      description: |
        Um item por ligação, ordenados pelo título citado, depois por tipo, predicado
        e caminho da nota a que ligam. A ligação ambígua aparece uma vez para cada nota
        com o título, e a não resolvida uma vez, com target null. A mesma ligação
        escrita de novo na nota, ainda que em outra caixa, conta uma vez, com a
        primeira grafia. O viewer também lê.

        Uma ligação é um wikilink ([[Título]], [[Título|apelido]], [[Título#Seção]],
        [[Título^bloco]]), um embed (![[...]], anexos inclusive) ou um link markdown para
        um arquivo .md, escritos fora de bloco e de trecho de código. Âncora de seção e
        de bloco é descartada, e [[#Seção]] não é ligação. A ligação cita um título e
        liga a todas as notas do mesmo cofre com esse título: o último segmento do
        caminho sem .md, ou um dos aliases do frontmatter, sem diferença de caixa nem de
        forma Unicode, mas com diferença de acento. O link markdown resolve pelo
        caminho, relativo à pasta da nota ou à raiz do cofre se começar com /, e o
        wikilink ou embed com pasta ([[pasta/Nota]]) pelo caminho a partir da raiz do
        cofre, com .md quando falta; sem nota nesse caminho, vale o título do último
        segmento. A nota que cita a si mesma não conta. A resolução é feita na leitura,
        então renomear, mover ou apagar uma nota muda as ligações das outras na hora; o
        que a própria nota cita só muda quando o indexador processa o cofre dela. Ligação
        para outro cofre é sempre não resolvida.

        Também é ligação a tipada: a chave do frontmatter cujo valor é um wikilink
        inteiro, entre aspas (autor: "[[Fulana]]") ou sem elas (autor: [[Fulana]]), ou
        uma lista com wikilinks. A chave é o predicado, como escrita, e o alvo resolve
        como o wikilink do corpo. Valor literal (texto, número, data, tag) e a chave aliases
        não viram ligação.

        Também conta a ligação inferida: para cada ligação não resolvida, o indexador
        escolhe a nota cujo título está a no máximo 0,2 de distância de edição do
        título citado, sem caixa e sem acento, desempatando por probabilidade a priori
        e parentesco no grafo. Ela nunca é escrita na nota, aparece como item próprio
        de type inferred e é o inferred_target da ligação não resolvida que a originou.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NoteID'
        - $ref: '#/components/parameters/LinkType'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Lista, vazia quando não há nenhum item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Parâmetro de consulta inválido (invalid_request), com o parâmetro e o valor na mensagem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Nota inexistente ou fora dos cofres do usuário (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /notes/{id}/backlinks:
    get:
      summary: Lista as ligações para esta nota
      description: |
        As ligações resolvidas de outras notas do cofre para esta, um item por ligação,
        ordenados pelo caminho da nota que liga, depois por título citado, tipo e
        predicado. A resolução segue as regras de GET /v1/notes/{id}/links. O viewer
        também lê.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NoteID'
        - $ref: '#/components/parameters/LinkType'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Lista, vazia quando não há nenhum item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Parâmetro de consulta inválido (invalid_request), com o parâmetro e o valor na mensagem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Nota inexistente ou fora dos cofres do usuário (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /search/notes:
    get:
      summary: Busca notas por texto no índice léxico
      description: |
        Busca por palavras no título (o nome do arquivo sem extensão, mais os aliases do
        frontmatter) e no conteúdo das notas, com a sintaxe de busca web do PostgreSQL:
        termos soltos exigem todos, aspas pedem a frase, OR aceita qualquer um dos lados
        e -termo exclui. Não é busca por substring, e % e _ não são curinga. A
        configuração de texto é a do indexador (MARKUPP_SEARCH_CONFIG).

        O resultado vem do mais relevante para o menos, com o título e os aliases
        pesando mais que o conteúdo, e desempate pelo id. Só aparecem notas já
        indexadas: a nota recém escrita entra na busca quando o indexador processa o
        cofre dela. Consulta sem palavra buscável, como só stopwords, devolve lista
        vazia. O resultado não carrega o conteúdo da nota, só um trecho dele.

        Com vault, busca só nas notas desse cofre; sem ele, em todos os cofres do
        usuário. Cada resultado traz a relevância (ts_rank com normalização 1), que
        ordena a lista. O viewer também lê.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Consulta na sintaxe de websearch_to_tsquery, como `"frase exata" OR termo -excluido`
        - name: vault
          in: query
          required: false
          schema:
            type: string
          description: Cofre em que buscar; sem ele, todos os cofres do usuário
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Resultados da busca, vazio quando nada casa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchHitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: q ausente, ou offset e limit não inteiros (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cofre inexistente ou de que o usuário não é membro (vault_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /vaults/{id}/communities:
    get:
      summary: Lista as comunidades do cofre
      description: |
        Uma linha por comunidade, das maiores para as menores, depois por id, com a
        nota de maior PageRank dela.

        Comunidades do cofre pelo Louvain (resolução 1, semente fixa) na projeção não
        dirigida do grafo de ligações, ligação inferida incluída. Nota sem ligação não
        tem comunidade. A comunidade mantém o id da anterior com mais notas em comum
        quando o Jaccard entre as duas é de pelo menos 0,5. O indexador recalcula tudo
        no segundo estágio do cofre, quando ligações ou títulos mudam. As notas de uma
        comunidade estão em GET /v1/vaults/{id}/notes?community={cid}. O viewer também
        lê.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/VaultID'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Lista, vazia quando não há nenhum item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: offset ou limit não inteiros (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cofre inexistente ou de que o usuário não é membro (vault_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /vaults/{id}/communities/{cid}:
    get:
      summary: Lê uma comunidade do cofre
      description: |
        Comunidades do cofre pelo Louvain (resolução 1, semente fixa) na projeção não
        dirigida do grafo de ligações, ligação inferida incluída. Nota sem ligação não
        tem comunidade. A comunidade mantém o id da anterior com mais notas em comum
        quando o Jaccard entre as duas é de pelo menos 0,5. O indexador recalcula tudo
        no segundo estágio do cofre, quando ligações ou títulos mudam. As notas de uma
        comunidade estão em GET /v1/vaults/{id}/notes?community={cid}. O viewer também
        lê.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/VaultID'
        - name: cid
          in: path
          required: true
          description: Id da comunidade
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Comunidade encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Id de comunidade não inteiro (invalid_id), com o valor na mensagem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cofre inexistente ou de que o usuário não é membro (vault_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: O cofre não tem comunidade com esse id (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /vaults/{id}/graph:
    get:
      summary: Lê o grafo do cofre para desenhar
      description: |
        O cofre inteiro, sem paginação: um nó por nota, com grau, PageRank e
        comunidade, e um nó sem nota por título não resolvido (inclusive anexo), e as
        ligações como pares de índices no array de nós. Ligação inferida tem o mesmo
        peso da escrita, só marcada pelo tipo. Os filtros escondem órfãs, nós sem nota
        e ligações inferidas, ou recortam por comunidade; ligação com ponta escondida
        também sai. A resposta vem com gzip quando o cliente aceita e com ETag fraco
        pela versão do grafo do cofre, que muda quando o segundo estágio do indexador
        roda; antes do primeiro segundo estágio não há ETag. Cache-Control private,
        no-cache: só o navegador guarda, e revalida antes de usar. O viewer também lê.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/VaultID'
        - $ref: '#/components/parameters/GraphOrphans'
        - $ref: '#/components/parameters/GraphUnresolved'
        - $ref: '#/components/parameters/GraphInferred'
        - $ref: '#/components/parameters/GraphAutomatic'
        - $ref: '#/components/parameters/GraphCommunity'
        - $ref: '#/components/parameters/GraphIfNoneMatch'
      responses:
        '200':
          description: Grafo, com nós e ligações vazios quando não há nota
          headers:
            ETag:
              $ref: '#/components/headers/GraphETag'
            Cache-Control:
              $ref: '#/components/headers/GraphCacheControl'
            Content-Encoding:
              $ref: '#/components/headers/GraphContentEncoding'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphResponse'
        '304':
          description: If-None-Match traz a versão atual do grafo; sem corpo
          headers:
            ETag:
              $ref: '#/components/headers/GraphETag'
            Cache-Control:
              $ref: '#/components/headers/GraphCacheControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Filtro inválido (invalid_request), com o valor e o formato esperado na mensagem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cofre inexistente ou de que o usuário não é membro (vault_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /notes/{id}/graph:
