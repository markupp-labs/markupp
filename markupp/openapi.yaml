  /v1/notes/{id}/links:
    get:
      summary: Lista as ligações que esta nota faz
      description: |
        Um item por ligação, ordenados pelo título citado, depois por tipo, predicado
        e caminho da nota a que ligam. A ligação ambígua aparece uma vez para cada nota
        com o título, e a não resolvida uma vez, com target null. A mesma ligação
        escrita de novo na nota, ainda que em outra caixa, conta uma vez, com a
        primeira grafia. O viewer também lê.

        Uma ligação é um wikilink ([[Título]], [[Título|apelido]], [[Título#Seção]],
        [[Título^bloco]]), um embed (![[...]], anexos inclusive) ou um link markdown para
        um arquivo .md, escritos fora de bloco e de trecho de código. Âncora de seção e
        de bloco é descartada, e [[#Seção]] não é ligação. A ligação cita um título e
        liga a todas as notas do mesmo cofre com esse título: o último segmento do
        caminho sem .md, ou um dos aliases do frontmatter, sem diferença de caixa nem de
        forma Unicode, mas com diferença de acento. O link markdown resolve pelo
        caminho, relativo à pasta da nota ou à raiz do cofre se começar com /, e o
        wikilink ou embed com pasta ([[pasta/Nota]]) pelo caminho a partir da raiz do
        cofre, com .md quando falta; sem nota nesse caminho, vale o título do último
        segmento. A nota que cita a si mesma não conta. A resolução é feita na leitura,
        então renomear, mover ou apagar uma nota muda as ligações das outras na hora; o
        que a própria nota cita só muda quando o indexador processa o cofre dela. Ligação
        para outro cofre é sempre não resolvida.

        Também é ligação a tipada: a chave do frontmatter cujo valor é um wikilink
        inteiro, entre aspas (autor: "[[Fulana]]") ou sem elas (autor: [[Fulana]]), ou
        uma lista com wikilinks. A chave é o predicado, como escrita, e o alvo resolve
        como o wikilink do corpo. Valor literal (texto, número, data, tag) e a chave aliases
        não viram ligação.

        Também conta a ligação inferida: para cada ligação não resolvida, o indexador
        escolhe a nota cujo título está a no máximo 0,2 de distância de edição do
        título citado, sem caixa e sem acento, desempatando por probabilidade a priori
        e parentesco no grafo. Ela nunca é escrita na nota, aparece como item próprio
        de type inferred e é o inferred_target da ligação não resolvida que a originou.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NoteID'
        - $ref: '#/components/parameters/LinkType'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Lista, vazia quando não há nenhum item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Parâmetro de consulta inválido (invalid_request), com o parâmetro e o valor na mensagem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Nota inexistente ou fora dos cofres do usuário (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
