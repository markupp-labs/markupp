  /v1/notes/{id}/mentions:
    get:
      summary: Lista os títulos que esta nota menciona sem ligar
      description: |
        As notas do cofre cujo título esta nota cita no texto sem ligar, com o título
        citado.

        Menção não ligada é um título de nota (o último segmento do caminho sem .md ou
        um alias) citado no texto de outra nota do mesmo cofre sem ligação entre as
        duas, em sentido algum. É sugestão de ligação e é calculada na leitura, sobre
