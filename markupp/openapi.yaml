openapi: 3.0.3
info:
  title: Markupp Server API
  description: |
    API REST para gerenciamento de notas do projeto Markupp, orientada a recursos
    (ADR-0040): a coleção vive sob o recurso que a contém, o item de id global é
    endereçado direto, a relação é sub-coleção por sentido e a visão sobre uma
    coleção é parâmetro de consulta.

    Todas as rotas vivem sob /v1 (ADR-0026). Durante a transição, os mesmos caminhos
    continuam servidos sem prefixo, com os cabeçalhos Deprecation (RFC 9745) e
    Link rel="successor-version" apontando o caminho sob /v1; sem prefixo, a nota
    mantém a representação antiga, sem a organização derivada. As rotas /accounts, /oauth/requests,
    /accounts/external, /login-providers, /auth/external-login, /me/identities, /me/authorizations,
    /me/notifications, /vaults, /search, /publications, /public e as sub-coleções de /notes/{id}
    nasceram depois da transição e existem só sob /v1, sem o caminho sem prefixo.

    As rotas /v1/public/notes/{public_id} leem as notas publicadas sem conta (ADR-0048), pelo
    id público, com CORS aberto a qualquer origem e limite por IP. Nota não publicada e id
    inexistente respondem igual, 404 not_found, e o id interno da nota nunca aparece nelas.

    Os endpoints do protocolo OAuth (/oauth/authorize, /oauth/token, /oauth/revoke e a
    metadata em /.well-known/oauth-authorization-server) ficam na raiz, fora de /v1, e
    seguem as RFCs, com um desvio intencional da RFC 7009 (ADR-0046): /oauth/revoke
    responde 200 sem revogar nada quando o token é de outro cliente, em vez de recusar o
    pedido, para não revelar a quem o token pertence.
  version: 0.1.0
servers:
  - url: http://localhost:8080/v1
    description: Servidor local padrão
security:
  - bearerAuth: []
paths:
  /accounts:
    post:
      summary: Cria a conta local e abre a sessão dela
      description: >
        A primeira conta da instalação vira owner do tenant inicial, com o primeiro cofre,
        mesmo com o auto-registro desligado. As outras só nascem com
        MARKUPP_AUTH_REGISTRATION_ENABLED ligado, sem tenant, e com SMTP recebem o email de
        verificação. Existe só sob /v1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Conta criada, com a sessão aberta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: >
            Email ou senha ausentes, ou senha acima de 72 bytes (invalid_request), senha com menos de 15 caracteres (password_too_short) ou senha da lista de senhas comuns (common_password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Auto-registro desligado e a instalação já tem conta (registration_disabled), ou
            credencial local desligada (local_auth_disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: O email já tem conta (already_exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /accounts/external:
    post:
      summary: Cria a conta por um provedor externo e abre a sessão dela
      description: >
        Troca o código do provedor pela identidade (ADR-0054) e cria a conta com o email que o
        provedor informa, sem senha. Segue o auto-registro como POST /accounts; o email nasce
        verificado quando o provedor o afirma verificado. Existe só sob /v1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCallbackRequest'
      responses:
        '201':
          description: Conta criada, com a sessão aberta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/ExternalLoginRefused'
        '401':
          $ref: '#/components/responses/ExternalLoginRefused'
        '403':
          description: Auto-registro desligado e a instalação já tem conta (registration_disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            A identidade já é de uma conta (identity_already_linked) ou o email já tem conta
            (already_exists), que vincula o provedor logada em POST /me/identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: O provedor não informou email (provider_email_missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/LoginProviderUnavailable'
  /login-providers:
    get:
      summary: Lista os provedores externos de login da instalação
      description: Lista vazia quando a instalação não configura nenhum. Existe só sob /v1.
      security: []
      responses:
        '200':
          description: Provedores na ordem de MARKUPP_LOGIN_PROVIDERS
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoginProviderResponse'
  /login-providers/{id}/attempts:
    post:
      summary: Começa uma tentativa de login no provedor
      description: >
        Devolve a URL do provedor e o state, o verifier PKCE e o nonce, que o cliente guarda
        até o callback e devolve com o código. O servidor não guarda a tentativa. Existe só
        sob /v1.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Tentativa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAttemptResponse'
        '404':
          description: Provedor não configurado (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/LoginProviderUnavailable'
  /auth/external-login:
    post:
      summary: Abre a sessão por um provedor externo
      description: >
        Troca o código do provedor pela identidade e abre a sessão da conta que a tem
        vinculada. Nunca cria conta: identidade sem conta responde identity_not_linked.
        Existe só sob /v1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCallbackRequest'
      responses:
        '200':
          description: Sessão aberta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/ExternalLoginRefused'
        '401':
          $ref: '#/components/responses/ExternalLoginRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/LoginProviderUnavailable'
  /me/identities:
    get:
      summary: Lista as identidades externas da conta
      description: >
        A senha não aparece. Só aceita token de login, nunca token OAuth (first_party_only).
        Existe só sob /v1.
      responses:
        '200':
          description: Identidades na ordem em que foram vinculadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Vincula um provedor externo à conta logada
      description: >
        Troca o código do provedor pela identidade e a vincula à conta do token. O vínculo
        só nasce assim, nunca pelo email do provedor (ADR-0054). Só aceita token de login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCallbackRequest'
      responses:
        '201':
          description: Identidade vinculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '400':
          $ref: '#/components/responses/ExternalLoginRefused'
        '401':
          $ref: '#/components/responses/ExternalLoginRefused'
        '409':
          description: A identidade já é de uma conta (identity_already_linked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/LoginProviderUnavailable'
  /me/identities/{id}:
    delete:
      summary: Desvincula uma identidade externa da conta
      description: >
        Recusa quando nenhuma das formas de entrar que restam vale na instalação: a senha
        desligada ou o provedor fora da configuração não contam. Só aceita token de login.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Identidade desvinculada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: A conta não tem essa identidade externa (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: É a última forma de entrar na conta (last_identity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: Abre a sessão com credencial local
      description: >
        Só entra em conta que já existe: email sem conta é recusado como credencial
        inválida, e a conta nasce em POST /accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão aberta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Email ou senha ausentes, ou senha acima de 72 bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais inválidas (invalid_credentials)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Credencial local desligada na configuração (local_auth_disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      summary: Troca o refresh token por um novo par
      description: >
        O refresh token é de uso único. Reapresentar um token já usado revoga todas as
        sessões do usuário.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Novo par de tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          description: Refresh token inválido, expirado ou revogado (invalid_refresh_token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      summary: Revoga o refresh token da sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sessão encerrada, inclusive quando o token já não valia
  /auth/invites/accept:
    post:
      summary: Cria a conta local a partir de um convite
      description: >
        Para quem ainda não tem conta: troca o token do convite e a senha escolhida por
        uma conta vinculada ao tenant com o papel do convite e um cofre próprio, e abre a
        sessão. Quem já tem conta aceita em /me/invites/{id}/accept. O convite é de uso
        único, e a recusa também encerra o token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Conta criada e sessão aberta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: >
            Convite inexistente, vencido ou já aceito (invalid_invite), senha ausente ou acima de
            72 bytes (invalid_request), senha com menos de 15 caracteres (password_too_short) ou senha da lista de senhas comuns (common_password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: O email do convite já tem conta; aceite pela conta em /me/invites (already_exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/email/verification:
    post:
      summary: Envia de novo o email de verificação da conta
      description: >
        Gera um pedido novo e invalida o token anterior. Dentro de 5 minutos do último
        pedido, responde 202 sem enviar outro email. Só existe com SMTP configurado.
      responses:
        '202':
          description: Pedido aceito
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: O email da conta já está verificado (email_already_verified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Sem SMTP configurado (email_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/email/verify:
    post:
      summary: Verifica o email da conta logada com o token recebido por email
      description: >
        Exige login, e o token só vale para a conta logada: quem recebe o email de uma
        conta que não criou não consegue verificá-la. O token vale 24 horas a partir do
        envio e uma vez só. A conta verificada passa a receber convites em /me/invites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenRequest'
      responses:
        '204':
          description: Email verificado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Token inexistente, vencido, já usado ou de outra conta (invalid_token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/forgot:
    post:
      summary: Pede o email de troca de senha
      description: >
        Responde 202 exista a conta ou não, e no mesmo tempo, porque o pedido é gravado
        depois da resposta. Só a conta com credencial local recebe o email, no máximo um
        a cada 5 minutos. Só existe com SMTP configurado e credencial local ligada.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '202':
          description: Pedido aceito
        '400':
          description: Email vazio (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Credencial local desligada (local_auth_disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Sem SMTP configurado (email_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/reset:
    post:
      summary: Troca a senha com o token recebido por email
      description: >
        O token vale 1 hora a partir do envio e uma vez só. A troca encerra todas as
        sessões abertas da conta e marca o email dela como verificado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Senha trocada
        '400':
          description: >
            Token inexistente, vencido ou já usado (invalid_token), senha ausente ou acima de
            72 bytes (invalid_request), senha com menos de 15 caracteres (password_too_short) ou senha da lista de senhas comuns (common_password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Credencial local desligada (local_auth_disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users:
    get:
      summary: Lista os membros do tenant
      description: >
        Aberta a qualquer membro do tenant, viewer inclusive, com o mesmo formato para
        todos; é onde se acha o id do colega a pôr num cofre. Token OAuth precisa do escopo
        notas:leitura ou administracao.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Membros do tenant, por email, com o papel de cada um
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/invites/{id}:
    delete:
      summary: Revoga um convite ainda sem resposta
      description: Exige papel owner ou admin.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/InviteID'
      responses:
        '204':
          description: Convite revogado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InviteNotFound'
  /users/{id}:
    patch:
      summary: Troca o papel de um membro
      description: >
        Exige papel owner ou admin. Ninguém altera quem está acima nem concede papel acima
        do próprio, e o tenant nunca fica sem owner.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/MemberID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '204':
          description: Papel trocado
        '400':
          description: Papel inexistente (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sem papel de administração (forbidden) ou papel acima do próprio (role_above_own)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '409':
          $ref: '#/components/responses/LastOwner'
    delete:
      summary: Remove um membro do tenant
      description: >
        Exige papel owner ou admin, com as mesmas regras da troca de papel. Os cofres em
        que o membro era o único, com as notas, são apagados, e os convites pendentes para
        o email dele no tenant deixam de valer.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/MemberID'
      responses:
        '204':
          description: Membro removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sem papel de administração (forbidden) ou membro acima do próprio papel (role_above_own)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '409':
          $ref: '#/components/responses/LastOwner'
  /users/invites:
    get:
      summary: Lista os convites do tenant
      description: Exige papel owner ou admin no tenant. O token do convite nunca volta aqui.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Convites do mais recente ao mais antigo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InviteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Convida um email para o tenant
      description: >
        Exige papel owner ou admin, e o papel do convite não passa do de quem convida.
        Quem já tem conta vê o convite em /me/invites. O token serve para quem ainda
        não tem conta se cadastrar. Sem SMTP configurado, ele volta uma única vez nesta
        resposta e o administrador o repassa. Com SMTP, ele não volta: o servidor gera
        o token na entrega e o envia só por email. Vale por 7 dias. Em 24 horas, cada
        conta emite até 20 convites somando todos os tenants dela, e cada tenant recebe
        até 50, ajustáveis em MARKUPP_INVITE_LIMIT_PER_ACCOUNT e
        MARKUPP_INVITE_LIMIT_PER_TENANT; convite revogado continua contando. Com SMTP, só
        convida a conta que já confirmou o email.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Convite emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInviteResponse'
        '400':
          description: Email ou papel inválido (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            Sem papel de administração (forbidden), papel acima do próprio (role_above_own)
            ou, com SMTP, conta que ainda não confirmou o email (email_not_verified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: O email já é de um membro do tenant (already_member)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: A conta ou o tenant chegou ao limite de convites em 24 horas (invite_limit_reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants:
    post:
      summary: Cria um tenant
      description: Qualquer conta cria tenant e vira owner dele, com um cofre próprio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Aparado nas pontas, de 1 a 100 caracteres (não bytes)
      responses:
        '201':
          description: Tenant criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Nome vazio ou acima de 100 caracteres (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tenants/{id}:
    delete:
      summary: Apaga um tenant
      description: >
        Só o owner apaga. Apaga de vez, numa transação, o tenant e tudo que pertence a ele:
        cofres, notas e o que deriva delas, vínculos e convites. As contas continuam, e a
        auditoria guarda quem apagou. O tenant vem do caminho, não do cabeçalho
        X-Markupp-Tenant.
      parameters:
        - name: id
          in: path
          required: true
