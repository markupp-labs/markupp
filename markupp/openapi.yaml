  /notes/{id}/mentions:
    get:
      summary: Lista os títulos que esta nota menciona sem ligar
      description: |
        As notas do cofre cujo título esta nota cita no texto sem ligar, com o título
        citado.

        Menção não ligada é um título de nota (o último segmento do caminho sem .md ou
        um alias) citado no texto de outra nota do mesmo cofre sem ligação entre as
        duas, em sentido algum. É sugestão de ligação e é calculada na leitura, sobre
        o que o indexador já processou.

        O título casa inteiro, com fronteira de palavra, sem diferença de caixa nem de
        acento, fora de wikilink, embed e link markdown. Ficam de fora a própria nota,
        títulos com menos de 3 letras, títulos que são stopword em português ou inglês
        e títulos comuns, que estão no corpo de mais de max(5% das notas do cofre, 5)
        notas; antes do primeiro segundo estágio do cofre nenhum título é comum.

        Cada nota aparece uma vez, com o título de maior prior: a probabilidade a
        priori de o título apontar para a nota citada, com suavização de Laplace,
        (notas que ligam à nota citada por esse título + 1) / (notas do cofre com o
        título no corpo + notas do cofre com esse título). A lista vem da maior prior
        para a menor, depois por caminho. O viewer também lê.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NoteID'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Lista, vazia quando não há nenhum item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MentionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: offset ou limit não inteiros (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Nota inexistente ou fora dos cofres do usuário (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
