        com as ligações entre elas e os nós sem nota que as notas a menos de depth
        saltos citam. Mesmo formato, filtros, gzip, ETag e Cache-Control de
        GET /v1/vaults/{id}/graph; o filtro vale também no caminho, e a nota lida
