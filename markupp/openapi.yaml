        priori de o título apontar para a nota citada, com suavização de Laplace,
        (notas que ligam à nota citada por esse título + 1) / (notas do cofre com o
        título no corpo + notas do cofre com esse título). A lista vem da maior prior
        para a menor, depois por caminho. O viewer também lê.
