        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Atualiza uma nota
      description: |
        Mesmo contrato de escrita de PUT /notes/{id}, com optimistic locking por
        lastModifiedAt e sobrescrita com force. A resposta traz a organização derivada
        que o último segundo estágio gravou, anterior a esta escrita.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NoteID'
      requestBody:
        required: true
